# Prometheus do ambiente (compose e Railway).
#
# Quem guarda e consulta as metricas. O collector so as expoe: o Prometheus vem buscar na porta
# 8889 dele, pela rede privada. O nome `otel-collector.railway.internal` e o que o Railway da ao
# servico chamado `otel-collector`; no compose o mesmo nome existe como alias de rede.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.railway.internal:8889"]
    # O collector ja poe `service_name` em cada metrica; o `job` do Prometheus so atrapalharia.
    honor_labels: true

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Qdrant expoe as proprias metricas em /metrics (formato Prometheus). Ele nao precisa passar
  # pelo collector. Atencao: ele responde a cada coleta, e isso conta como trafego: um Qdrant com
  # serverless ligado deixa de dormir enquanto for monitorado.
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant.railway.internal:6333"]
