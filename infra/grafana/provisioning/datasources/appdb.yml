apiVersion: 1

# Consumo de IA, lido do banco da aplicacao (tabela llm_usage_hourly). As metricas do Prometheus
# perdem a primeira contagem de cada serie nova (o `increase()` parte da segunda amostra), o que
# apaga justo as primeiras chamadas de um uso pequeno; o banco guarda o numero exato, por hora,
# provedor, modelo e cliente.
#
# O usuario precisa ser o `monitor`, com SELECT so nessa tabela e em tres colunas dos usuarios
# (veja deploy-railway.md). Endereco e senha vem do ambiente do Grafana. Sem essas variaveis o
# Grafana sobe normalmente e so os quadros de consumo ficam sem dado.
datasources:
  - name: App (MySQL)
    uid: appdb
    type: mysql
    access: proxy
    url: ${GRAFANA_DB_HOST}
    user: ${GRAFANA_DB_USER}
    editable: false
    jsonData:
      database: ${GRAFANA_DB_NAME}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
