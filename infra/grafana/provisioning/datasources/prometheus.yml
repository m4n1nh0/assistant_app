apiVersion: 1

datasources:
  - name: Prometheus
    # uid fixo: o painel referencia a fonte por ele.
    uid: prometheus
    type: prometheus
    access: proxy
    # Nome que o Railway da ao servico `prometheus` na rede privada (no compose, e um alias).
    url: http://prometheus.railway.internal:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
