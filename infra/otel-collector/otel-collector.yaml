# Collector do ambiente (compose e Railway).
#
# A aplicacao nao conhece nenhum fornecedor de observabilidade: ela exporta OTLP e este arquivo
# decide para onde vai. Trocar de backend e acrescentar um exporter aqui, sem tocar no codigo.
#
# Dois sinais entram pelo mesmo receptor OTLP:
#
# - traces: vao para o log (exporter `debug`) e tambem alimentam o conector `spanmetrics`, que
#   transforma os spans em contagem de chamadas, erros e latencia por tipo de operacao.
# - metricas: as da aplicacao (tokens, custo e duracao de chamadas a modelos, duracao de
#   requisicoes HTTP) mais as do `spanmetrics`, expostas em formato Prometheus na porta 8889.
#   Quem le (Prometheus) vem buscar; o collector nao empurra.

extensions:
  # Verificacao de saude do proprio collector, para o healthcheck da plataforma.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Saude do MySQL e do Redis, lida direto deles. Endereco e credencial vem do ambiente do
  # collector (no Railway, das variaveis do servico; no compose, do docker-compose.yml). O MySQL
  # pede um usuario so de leitura (PROCESS, REPLICATION CLIENT e SELECT), nao o da aplicacao.
  # Sem as variaveis valem os padroes abaixo (localhost): o receptor so registra erro de conexao a
  # cada coleta e o resto segue. Um endereco vazio derrubaria o collector no boot.
  mysql:
    endpoint: ${env:MYSQL_ENDPOINT:-localhost:3306}
    username: ${env:MYSQL_MONITOR_USER:-monitor}
    password: ${env:MYSQL_MONITOR_PASSWORD:-}
    collection_interval: 30s
    tls:
      insecure: true
    # O receptor traz desligadas justamente as que mais interessam: conexoes e consultas.
    metrics:
      mysql.connection.count:
        enabled: true
      mysql.connection.errors:
        enabled: true
      mysql.query.count:
        enabled: true
      mysql.query.slow.count:
        enabled: true
      mysql.commands:
        enabled: true
      mysql.client.network.io:
        enabled: true
  redis:
    endpoint: ${env:REDIS_ENDPOINT:-localhost:6379}
    password: ${env:REDIS_PASSWORD:-}
    collection_interval: 30s

processors:
  # Da nome ao destino das chamadas que saem (span de CLIENTE), para o mapa de servicos mostrar
  # "mysql", "redis" e "qdrant" (db.name, que o mapa trata como banco) e o dominio dos demais
  # (peer.service, no virtual: provedor de modelo, por exemplo). Servico nosso que recebe a
  # chamada nao depende disto: o par cliente-servidor se forma pelo proprio trace.
  transform/peer:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["db.name"], "mysql") where kind == SPAN_KIND_CLIENT and (attributes["db.system"] == "mysql" or attributes["db.system.name"] == "mysql")
          - set(attributes["db.name"], "redis") where kind == SPAN_KIND_CLIENT and (attributes["db.system"] == "redis" or attributes["db.system.name"] == "redis")
          - set(attributes["db.name"], "qdrant") where kind == SPAN_KIND_CLIENT and (IsMatch(attributes["http.url"], ".*qdrant.*") or IsMatch(attributes["url.full"], ".*qdrant.*"))
          - set(attributes["peer.service"], attributes["server.address"]) where kind == SPAN_KIND_CLIENT and attributes["peer.service"] == nil and attributes["server.address"] != nil
          - set(attributes["peer.service"], attributes["net.peer.name"]) where kind == SPAN_KIND_CLIENT and attributes["peer.service"] == nil and attributes["net.peer.name"] != nil
          - set(attributes["peer.service"], ExtractPatterns(attributes["http.url"], "^https?://(?P<host>[^/:?#]+)")["host"]) where kind == SPAN_KIND_CLIENT and attributes["peer.service"] == nil and attributes["http.url"] != nil
          - set(attributes["peer.service"], ExtractPatterns(attributes["url.full"], "^https?://(?P<host>[^/:?#]+)")["host"]) where kind == SPAN_KIND_CLIENT and attributes["peer.service"] == nil and attributes["url.full"] != nil
          - replace_pattern(attributes["peer.service"], "[.]railway[.]internal$", "") where kind == SPAN_KIND_CLIENT
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 20

connectors:
  # Mapa de servicos: casa o span de cliente de um servico com o span de servidor do outro (mesmo
  # trace) e conta chamadas, falhas e latencia de cada par. Banco e provedor de modelo nao tem
  # span de servidor nosso: viram no virtual pelo peer.service que o processador acima define.
  servicegraph:
    latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    store:
      ttl: 10s
      max_items: 2000
    metrics_flush_interval: 15s
    virtual_node_peer_attributes: [peer.service]
  spanmetrics:
    namespace: assistant.spans
    histogram:
      explicit:
        buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s, 60s]
    # Tipo da operacao (llm, tool, mcp, graph, agent, node...). Nome do span e servico ja entram
    # por padrao; id de conversa ou de requisicao NAO entram: cada um criaria uma serie nova.
    dimensions:
      - name: assistant.span.kind
    metrics_flush_interval: 15s

exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    # Poe o nome do servico (assistant-api, mcp-service...) como rotulo de cada metrica.
    resource_to_telemetry_conversion:
      enabled: true
    # Serie que parou de chegar sai da pagina depois disso, em vez de ficar para sempre.
    metric_expiration: 15m
  # Guarda os traces no Tempo, que o Grafana consulta (mapa de servicos e busca de traces).
  otlphttp/tempo:
    endpoint: http://tempo.railway.internal:4318
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/peer, batch]
      exporters: [debug, otlphttp/tempo, spanmetrics, servicegraph]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph, mysql, redis]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
