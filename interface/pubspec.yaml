name: assistant_app
description: Aplicativo de assistente pessoal multiplataforma, nome dinâmico
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  provider: ^6.1.1
  flutter_riverpod: ^2.5.1

  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.7.1
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9

  url_launcher: ^6.2.4
  flutter_local_notifications: ^17.1.2
  window_manager: ^0.3.8
  hotkey_manager: ^0.2.0

  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  record: ^6.0.0
  edge_tts: ^0.1.5
  file_picker: ^11.0.3
  pdf: ^3.11.1
  printing: ^5.14.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/branding/
