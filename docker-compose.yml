services:
  mysql:
    image: mysql:8.4
    container_name: assistant-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: assistant
      MYSQL_USER: assistant
      MYSQL_PASSWORD: assistant
      MYSQL_ROOT_PASSWORD: assistant-root
    ports:
      - "3306:3306"
    volumes:
      - assistant_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "assistant", "-passistant"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: assistant-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - assistant_qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: assistant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - assistant_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: assistant-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - assistant_ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assistant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - assistant_data:/app/data
      - assistant_logs:/app/logs
    # `environment:` vence `env_file:` no Compose. O que esta aqui e topologia
    # do compose - o endereco dos outros containers -, e sobrescrever o
    # backend/.env e o comportamento desejado.
    #
    # MCP_TRANSPORT e TOOL_TRANSPORT NAO entram aqui de proposito: se
    # entrassem, defini-las no backend/.env passaria a nao ter efeito, sem erro
    # nenhum. Para o backend falar com os servicos extraidos, edite
    # backend/.env.
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      - DATABASE_URL=mysql+aiomysql://assistant:assistant@mysql:3306/assistant
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Servicos extraidos ---------------------------------------------------
  # Ficam atras de profiles porque nao sobem no desenvolvimento padrao: o
  # backend fala com eles in-process. Para exercitar o modo remoto:
  #
  #   cp backend/.env.mcp-service.example  backend/.env.mcp-service
  #   cp backend/.env.tool-service.example backend/.env.tool-service
  #   # e, no backend/.env: MCP_TRANSPORT=remote e TOOL_TRANSPORT=remote
  #   docker compose --profile services up
  #
  # Cada um tem o proprio env_file e nao herda o backend/.env: um processo que
  # nao le DATABASE_URL nem JWT_SECRET tambem nao deve recebe-los.
  #
  # E cada um tem o proprio Dockerfile, com o recorte de dependencias que ele de
  # fato carrega: ~100 MB no mcp-service e ~136 MB no tool-service, contra os
  # ~2 GB de wheels de CUDA que a imagem cheia instala por causa do
  # faster-whisper. O agent-orchestrator e a excecao, e o comentario dele diz
  # por que.
  #
  # O comando de entrada e o CMD de cada Dockerfile - `python -m
  # services.<x>.main`, o mesmo do PaaS, que passa por serve() e faz PORT e
  # RELOAD se comportarem como em producao. Por isso nao ha `command:` aqui:
  # um lugar so decide como o servico sobe.
  #
  # Lembre que `environment:` vence `env_file:`. So entra ali o que o compose
  # decide, nunca configuracao de aplicacao.

  mcp-service:
    profiles: ["services", "mcp"]
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp-service
      args:
        # Servidor MCP stdio com `npx` precisa de Node dentro da imagem.
        # Servidores `http` nao precisam. Veja Dockerfile.mcp-service.
        WITH_NODE: "${MCP_WITH_NODE:-false}"
    container_name: assistant-mcp-service
    restart: unless-stopped
    ports:
      # Esquerda: a porta na sua maquina, mude se 8002 estiver ocupada.
      # Direita: a do container, fixada por PORT no .env.mcp-service - e igual
      # ao padrao do Settings enquanto esse arquivo nao existir.
      - "${MCP_HOST_PORT:-8002}:8002"
    environment:
      # Container nao vigia arquivo. O padrao do Settings e `true`, entao a
      # linha e necessaria mesmo antes de existir um .env.mcp-service.
      - RELOAD=false
    env_file:
      - path: ./backend/.env.mcp-service
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tool-service:
    profiles: ["services", "tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tool-service
      args:
        # So faz falta com MCP_TRANSPORT=local, quando este servico sobe os
        # servidores MCP por conta propria.
        WITH_NODE: "${TOOL_WITH_NODE:-false}"
    container_name: assistant-tool-service
    restart: unless-stopped
    ports:
      - "${TOOL_HOST_PORT:-8003}:8003"
    environment:
      - RELOAD=false
    # De onde vem as capacidades MCP (MCP_TRANSPORT, MCP_SERVICE_URL) esta no
    # .env.tool-service, e nao aqui: como `environment:` vence `env_file:`,
    # declarar o transporte nos dois lugares faria o arquivo virar decoracao.
    env_file:
      - path: ./backend/.env.tool-service
        required: false
    # Sem depends_on no mcp-service de proposito: o gateway tem timeout, retry e
    # disjuntor, e /health/ready reflete a indisponibilidade. Amarrar a ordem de
    # subida esconderia justamente o comportamento que se quer exercitar aqui.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Perfil proprio, fora de "services": o arranjo padrao de desenvolvimento e
  # MCP + ferramentas remotos com o grafo rodando dentro da assistant-api. Este
  # servico existe para teste de carga isolado do fluxo agentivo.
  #
  # UNICO servico extraido que usa a imagem cheia, e de proposito: ao atender
  # POST /orchestrate/chat ele importa agent_service e langchain_agent_service
  # (app/orchestration/nodes/dispatch.py:169), que puxam os SDKs de provedor, o
  # banco e o Qdrant. Uma imagem enxuta aqui subiria, passaria no healthcheck e
  # quebraria na primeira requisicao - economizar 2 GB em troca desse tipo de
  # falha nao e economia. Por isso tambem ele mantem `command:`: o CMD da imagem
  # cheia e o da assistant-api.
  agent-orchestrator:
    profiles: ["orchestrator"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assistant-agent-orchestrator
    restart: unless-stopped
    command: python -m services.orchestrator.main
    ports:
      - "${ORCHESTRATOR_HOST_PORT:-8001}:8001"
    environment:
      - RELOAD=false
    env_file:
      - path: ./backend/.env.orchestrator
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Collector de traces. Nao ha "observability-service" proprio: seria
  # reimplementar isto. A aplicacao exporta OTLP e o collector encaminha para o
  # backend de observabilidade que a instalacao escolher.
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: assistant-otel-collector
    restart: unless-stopped
    ports:
      - "${OBSERVABILITY_PORT:-8004}:4318"
      - "4317:4317"
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  assistant_data:
  assistant_logs:
  assistant_mysql:
  assistant_qdrant:
  assistant_redis:
  assistant_ollama:
