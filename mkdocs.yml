site_name: INTARQ - Documentacao do codigo-fonte
site_description: Referencia dos modulos do backend FastAPI, da interface Flutter e da infraestrutura local do INTARQ.
site_author: INTARQ
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: pt
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Sem isso o griffe nao acha `app.*`, que mora dentro de backend/.
          paths: [backend]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            members_order: source
            filters: ["!^_[^_]", "!^__(?!init__)"]
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Referencia do codigo:
      - referencia/index.md
      - Backend: referencia/backend/
      - Interface Flutter: referencia/interface.md
      - Infraestrutura: referencia/infra.md
  - Arquitetura:
      - Agentes, LangChain e LangGraph: arquitetura/agentes.md
      - Configuracao por servico: arquitetura/configuracao-por-servico.md
      - Deploy na Railway: arquitetura/deploy-railway.md
  - Funcionalidades:
      - Modo Educacao: funcionalidades/modo-educacao.md
      - Calendarios: funcionalidades/calendarios.md
      - Integracao com sistema academico: funcionalidades/sistema-academico.md
      - Agentes por disciplina: funcionalidades/agentes-por-disciplina.md
      - Memoria multi-turno: funcionalidades/memoria-multi-turno.md
      - Deteccao de alucinacao: funcionalidades/deteccao-alucinacao.md
      - Painel de saude dos provedores: funcionalidades/painel-provedores.md
      - Quiz:
          - Modo Educacao: funcionalidades/quiz/modo-educacao.md
          - Gerador automatico: funcionalidades/quiz/gerador-automatico.md
          - Integracao Flutter: funcionalidades/quiz/flutter.md
          - WebSocket e QR Code: funcionalidades/quiz/websocket-qrcode.md
          - Guia de testes: funcionalidades/quiz/testes.md
  - Produto:
      - Identidade INTARQ: produto/identidade.md
      - Roadmap comercial: produto/roadmap-comercial.md
