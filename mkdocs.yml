site_name: INTARQ - Documentacao do codigo-fonte
site_description: Referencia dos modulos do backend FastAPI, da interface Flutter e da infraestrutura local do INTARQ.
site_author: INTARQ
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: pt
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Sem isso o griffe nao acha `app.*`, que mora dentro de backend/.
          paths: [backend]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            members_order: source
            filters: ["!^_[^_]", "!^__(?!init__)"]
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Referencia do codigo:
      - referencia/index.md
      - Backend: referencia/backend/
      - Interface Flutter: referencia/interface.md
      - Infraestrutura: referencia/infra.md
  - Funcionalidades:
      - Modo Educacao: MODO_EDUCACAO.md
      - Quiz - Modo Educacao: quiz-modo-educacao.md
      - Quiz - integracao Flutter: quiz-flutter-integration.md
      - Quiz - WebSocket e QR Code: quiz-websocket-qrcode.md
      - Quiz - gerador automatico: auto-quiz-generator.md
      - Quiz - guia de testes: quiz-testing-guide.md
      - Calendarios: CONFIGURACAO_CALENDARIOS.md
      - Integracao com sistema academico: academic-system-integration-scraping.md
      - Agentes por disciplina: specialized-agents-by-discipline.md
      - Memoria multi-turno: multi-turn-memory-optimization.md
      - Deteccao de alucinacao: hallucination-detection-validation.md
      - Painel de saude dos provedores: llm-provider-health-dashboard.md
  - Produto:
      - Identidade INTARQ: IDENTIDADE_INTARQ.md
      - Roadmap comercial: ROADMAP_COMERCIAL_30_DIAS.md
