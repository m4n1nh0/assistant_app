[pytest]
testpaths = tests
python_files = test_*.py

# Separacao por natureza do teste, em vez de por pasta: mover cem arquivos
# criaria churn sem melhorar nada, e o marcador diz a mesma coisa e permite
# combinar (`-m "contract or integration"`).
#
#   unit         - uma unidade, sem I/O e sem dependencia externa. E o padrao:
#                  teste sem marcador e tratado como unitario.
#   integration  - mais de um componente real junto, ainda dentro do processo.
#   contract     - duas implementacoes do mesmo contrato precisam concordar
#                  (gateway local x remoto). E o que sustenta a promessa de que
#                  extrair um servico e configuracao, nao reescrita.
#   e2e          - atravessa o processo inteiro, da rota ao resultado.
markers =
    unit: unidade isolada, sem I/O
    integration: componentes reais integrados no mesmo processo
    contract: equivalencia entre implementacoes do mesmo contrato
    e2e: fluxo completo, da rota ao resultado

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
